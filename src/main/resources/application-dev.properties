server.port=8087

# ===============================
# Database Configuration
# ===============================

spring.datasource.url = jdbc:mysql://localhost:3306/auth_app
spring.datasource.username= root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false

spring.jpa.properties.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# JWT Configuration
# ===============================
security.jwt.secret=${JWT_SECRET:DJSNJSVCSKDCKDSMCKCJSDNGFVJVFOCLKVOFLJVNFKIHFUIOFRGNCKNICJSCSJGVIKVNCSLJTUSYHAJLJSCJBVKSVJSJASI}
security.jwt.issuer=${JWT_ISSUER:api.substring.com}
security.jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:3600}
security.jwt.refresh-ttl-seconds=${JWT_REFRESH_TTL_SECONDS:86400}
security.jwt.refresh-token-cookie-name=${JWT_REFRESH_COOKIE_NAME:refreshToken}
security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
security.jwt.cookie.http-only=${JWT_COOKIE_HTTP_ONLY:true}
security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:lax}
security.jwt.cookie-domain=${JWT_COOKIE_DOMAIN:localhost}

# ===============================
# OAuth2 - Google
# ===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}

#/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# ===============================
# OAuth2 - GitHub
# ===============================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:test-client-secret}
#/login/oauth2/code/github
spring.security.oauth2.client.registration.github.scope=user:email,read:user

#redirect-uri
#spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/aouth2/code/{registrationId}

app.auth.frontened.success-redirect: http://localhost:5173/auth/success
app.auth.frontened.failure-redirect: http://localhost:5173/auth/failure


# ===============================
# Logging
# ===============================

logging.level.org.springframework.security=DEBUG
